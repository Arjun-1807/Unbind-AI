[project]
name = "unbind-ai-backend"
version = "0.1.0"
description = "FastAPI backend for UnbindAI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    # >=3.4.0 fixes CVE-2024-33663 (algorithm confusion) and CVE-2024-33664
    # (JWE decompression-bomb DoS), both present in 3.3.0.
    "python-jose[cryptography]>=3.4.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.0.0",
    "motor>=3.3.0",
    "httpx>=0.27.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-groq>=0.1.0",
    "langchain-community>=0.2.0",
    "langchain-text-splitters>=0.2.0",
    "langsmith>=0.1.0",
    "huggingface_hub>=0.23.0",
    "pdfplumber>=0.10.0",
    # pypdf, not the archived/EOL PyPDF2 (unfixed infinite-loop DoS on malformed
    # input, CVE-2023-36464 class) — this parses attacker-controlled bytes.
    "pypdf>=5.0.0",
    # Imported at runtime by analysis_routes (DOCX extraction) and ocr_service
    # (image preprocessing) — an install from this file alone used to crash on
    # the first .docx or photo upload.
    "python-docx>=1.1.0",
    # >=11.0.0: multiple decoder CVEs across the 10.x line, and this decodes
    # user-uploaded photos/scans for OCR.
    "Pillow>=11.0.0",
    "numpy>=1.26.0",
    "pymongo>=4.6.0",
    # >=0.0.18: <0.0.7 Content-Type ReDoS (CVE-2024-24762), <0.0.18
    # malformed-boundary DoS (CVE-2024-53981). Parses upload bodies.
    "python-multipart>=0.0.18",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "venv"]

[tool.ruff.lint]
# pycodestyle errors/warnings, pyflakes, isort, pyupgrade, flake8-bugbear
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI relies on function-call defaults (File(...), Form(...))
    # `ruff format` owns line length for code; the remaining E501 hits are all
    # long prompt/HTML string literals that can't be wrapped without changing
    # their content, so we don't enforce E501 on top of the formatter.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]  # "useless expression" — intentional in assertions

name: Security

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: both jobs only read the checkout. Without this block the run
# inherits the repository default token scope, which may be read/write-all — and
# these jobs execute third-party tooling (the Semgrep image, the Gitleaks binary),
# so a supply-chain compromise there would inherit whatever the token can do.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    # The official Semgrep image ships the CLI and rule tooling preinstalled.
    # Pinned to an exact version AND digest: untagged means `:latest`, so the
    # scanner silently changed under us on every run and executed inside a job
    # holding the workflow token. The digest is the multi-arch OCI image index
    # for 1.172.0 — bump both together.
    container:
      image: semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Curated rulesets for this stack (Python/FastAPI backend + TS/React
      # frontend).
      #
      # `--error` is now ENABLED (it used to run in audit mode). Audit mode meant
      # findings were printed and then ignored, so the job was green no matter
      # what Semgrep discovered and nothing was ever blocked from merging — a
      # scanner whose result has no consequence isn't a control.
      #
      # If this turns the build red, triage rather than removing --error:
      #   * fix the real finding, or
      #   * suppress a false positive with a `# nosemgrep: <rule-id>` comment on
      #     the offending line, with a note explaining why it's safe.
      - name: Run Semgrep
        run: >-
          semgrep scan
          --config p/default
          --config p/python
          --config p/typescript
          --config p/react
          --config p/secrets
          --error
          --metrics off

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so pushes/PRs are scanned across all commits, not just
          # the tip — a secret added in an earlier commit still gets caught.
          fetch-depth: 0

      # Gitleaks is the one artifact this workflow fetches at runtime, so it gets
      # the same treatment as everything else here: actions/* are SHA-pinned and
      # the Semgrep image is digest-pinned, and this binary is now hash-pinned.
      # Previously the tarball was piped straight into `tar -xz` and installed to
      # /usr/local/bin as root — a pipe extracts before anything can be checked,
      # so a tampered release asset, a hijacked redirect, or a MITM on the
      # download would have executed as root inside a job holding the workflow
      # token. Downloading to a file first and refusing to unpack it until the
      # digest matches closes that window, and also pins us to the exact bytes
      # that were reviewed rather than to whatever currently sits behind the tag
      # (GitHub release assets are mutable — a tag can be re-cut).
      #
      # GITLEAKS_SHA256 is the digest of gitleaks_8.21.2_linux_x64.tar.gz as
      # published in the upstream release's gitleaks_8.21.2_checksums.txt.
      # Bump it together with GITLEAKS_VERSION, taking the new value from that
      # release's checksums.txt.
      #
      # `curl --fail` matters as much as the hash: without it an HTML error page
      # (rate limit, 404 from a typo'd version) is saved with a 0 exit status,
      # and `set -euo pipefail` makes any failure below abort the job rather than
      # falling through to a scan that never ran.
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL --fail --proto '=https' --tlsv1.2 \
            -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm -f "${archive}"
          gitleaks version

      # --config is passed explicitly rather than relying on gitleaks' implicit
      # "<source>/.gitleaks.toml" lookup, so a missing or renamed config is a hard
      # error instead of a silent fallback to the default rules — which is exactly
      # the failure mode that let a committed MongoDB URI pass this job. See
      # .gitleaks.toml for the added connection-string rules.
      # --exit-code 1 is the default, but stated explicitly: a hit MUST fail the
      # build, and nothing here should swallow the status.
      - name: Scan for secrets
        run: >-
          gitleaks detect
          --source .
          --config .gitleaks.toml
          --redact
          --verbose
          --exit-code 1
